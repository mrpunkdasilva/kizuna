services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: always
    networks:
      - kizuna_network

  python-scraper:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: python-scraper
    container_name: python_scraper
    depends_on:
      - ollama
      - selenium-hub
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/home/appuser/app
    environment:
      OLLAMA_HOST: http://ollama:11434
      SELENIUM_HUB_URL: http://selenium-hub:4444/wd/hub
    restart: always
    networks:
      - kizuna_network

  springboot-app:
    build:
      context: ./springboot-app
      dockerfile: Dockerfile
    image: springboot-app
    container_name: springboot_app
    depends_on:
      - ollama
      - python-scraper
    ports:
      - "8080:8080"
    volumes:
      - ./springboot-app:/app
    environment:
      OLLAMA_HOST: http://ollama:11434
      PYTHON_SCRAPER_HOST: http://python-scraper:8000
    restart: always
    networks:
      - kizuna_network

  selenium-hub:
    image: selenium/hub:4.18.1
    container_name: selenium-hub
    ports:
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"
    restart: always
    networks:
      - kizuna_network

  firefox:
    image: selenium/node-firefox:4.18.1
    container_name: firefox-node
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
    restart: always
    networks:
      - kizuna_network

volumes:
  ollama_data:

networks:
  kizuna_network:
    driver: bridge
