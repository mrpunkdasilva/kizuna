openapi: 3.0.0
info:
  title: Kizuna Copilot Python Scraper API
  version: 0.1.0
  description: API for extracting job information from various platforms. This service is dedicated to web scraping and returns raw job data.

servers:
  - url: http://localhost:8000
    description: Python Scraper Local Development Server

paths:
  /:
    get:
      summary: Root endpoint for health check
      operationId: getRoot
      responses:
        '200':
          description: Service is up and running
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Kizuna Copilot API is up and running!"

  /scrape-job/:
    post:
      summary: Scrape job details from a given URL using Selenium and Ollama
      operationId: scrapeJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobURL'
      responses:
        '200':
          description: Job data successfully scraped and processed by AI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrapedJobData'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: array
                    items:
                      type: object

components:
  schemas:
    JobURL:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: The URL of the job vacancy to be scraped.
          example: "https://www.linkedin.com/jobs/view/..."
        language:
          type: string
          description: Preferred language for the AI analysis.
          default: "pt-br"
      required:
        - url

    ScrapedJobData:
      type: object
      properties:
        title:
          type: string
          example: "Software Engineer"
        company:
          type: string
          example: "Tech Solutions Inc."
        location:
          type: string
          example: "São Paulo, SP"
        work_style:
          type: string
          example: "Remoto"
        employment_type:
          type: string
          example: "CLT"
        seniority:
          type: string
          example: "Senior"
        salary:
          type: string
          example: "R$ 15.000 - R$ 20.000"
        description:
          type: string
        requirements:
          type: array
          items:
            type: string
        benefits:
          type: array
          items:
            type: string
        tech_stack:
          type: array
          items:
            type: string
        soft_skills:
          type: array
          items:
            type: string
        posted_at:
          type: string
        applications_count:
          type: string
        pros:
          type: array
          items:
            type: string
        cons:
          type: array
          items:
            type: string
        interview_tips:
          type: array
          items:
            type: string
        ats_keywords:
          type: array
          items:
            type: string
        compatibility_score:
          type: string
          example: "85%"
        company_values:
          type: array
          items:
            type: string
        ai_summary:
          type: string

