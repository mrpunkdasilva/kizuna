openapi: 3.0.0
info:
  title: Kizuna Copilot Spring Boot Backend API
  version: 0.1.0
  description: Main backend API for the Kizuna Copilot. This service orchestrates calls to the Python Scraper, interacts with LLMs (Ollama), and manages the resume adaptation process.

servers:
  - url: http://localhost:8080
    description: Spring Boot Backend Local Development Server

paths:
  /: 
    get:
      summary: Root endpoint for health check (default Spring Boot 404)
      operationId: getRoot
      responses:
        '404':
          description: Not Found (expected for the default root endpoint without a specific controller)
          content:
            application/json:
              schema:
                type: object
                properties:
                  timestamp:
                    type: string
                    format: date-time
                    example: "2026-01-24T03:16:35.776+00:00"
                  status:
                    type: integer
                    example: 404
                  error:
                    type: string
                    example: "Not Found"
                  path:
                    type: string
                    example: "/"

  /api/ai/generate:
    post:
      summary: Generate content using Ollama LLM
      description: Proxies or orchestrates a call to the Ollama service to generate text based on a prompt.
      operationId: generateAIContent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIGenerationRequest'
      responses:
        '200':
          description: Content generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIGenerationResponse'

  /api/jobs/scrape:
    post:
      summary: Scrape and analyze a job vacancy
      description: Calls the Python Scraper to extract data and use AI to analyze the job requirements.
      operationId: scrapeAndAnalyzeJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobProcessRequest'
      responses:
        '201':
          description: Job scraped and saved successfully
          content:
            application/json:
              schema:
                $ref: 'python-scraper-api.yml#/components/schemas/ScrapedJobData'

components:
  schemas:
    JobProcessRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: The URL of the job vacancy to be processed.
          example: "https://www.linkedin.com/jobs/view/..."
      required:
        - url

    AIGenerationRequest:
      type: object
      properties:
        prompt:
          type: string
          description: The prompt to send to the LLM.
          example: "Summarize the following job description..."
        model:
          type: string
          description: The model to use (e.g., deepseek-r1:1.5b).
          default: "deepseek-r1:1.5b"
      required:
        - prompt

    AIGenerationResponse:
      type: object
      properties:
        response:
          type: string
          description: The text generated by the AI.
        done:
          type: boolean
          description: Whether the generation is complete.

