openapi: 3.0.0
info:
  title: Kizuna Copilot Spring Boot Backend API
  version: 0.1.0
  description: Main backend API for the Kizuna Copilot. This service orchestrates calls to the Python Scraper, interacts with LLMs (Ollama), and manages the resume adaptation process.

servers:
  - url: http://localhost:8080
    description: Spring Boot Backend Local Development Server

tags:
  - name: System
    description: Health check and root endpoints.
  - name: Jobs
    description: Scraping and CRUD operations for job postings stored in MongoDB.
  - name: Resume
    description: Resume tailoring, generation and PDF download.
  - name: AI
    description: Direct content generation with the Ollama LLM.

paths:
  /: 
    get:
      tags:
        - System
      summary: Root endpoint for health check (default Spring Boot 404)
      operationId: getRoot
      responses:
        '404':
          description: Not Found (expected for the default root endpoint without a specific controller)
          content:
            application/json:
              schema:
                type: object
                properties:
                  timestamp:
                    type: string
                    format: date-time
                    example: "2026-01-24T03:16:35.776+00:00"
                  status:
                    type: integer
                    example: 404
                  error:
                    type: string
                    example: "Not Found"
                  path:
                    type: string
                    example: "/"

  /api/jobs/scrape:
    post:
      tags:
        - Jobs
      summary: Scrape and analyze a job vacancy
      description: Enqueues the scraping job, returns immediately with a PENDING job posting, and processes the analysis in the background. Poll GET /api/jobs/{id} until status is COMPLETED or FAILED.
      operationId: scrapeAndAnalyzeJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobProcessRequest'
      responses:
        '202':
          description: Job accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPosting'

  /api/jobs:
    get:
      tags:
        - Jobs
      summary: List all saved job postings
      description: Returns every job posting stored in MongoDB, newest first.
      operationId: listJobs
      responses:
        '200':
          description: List of job postings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobPosting'

  /api/jobs/{id}:
    get:
      tags:
        - Jobs
      summary: Get a saved job posting by id
      description: Returns a single job posting stored in MongoDB.
      operationId: getJobById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The MongoDB id of the job posting.
      responses:
        '200':
          description: Job posting found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPosting'
        '404':
          description: Job posting not found
    put:
      tags:
        - Jobs
      summary: Update a saved job posting by id
      description: Updates only the fields provided in the request body (partial update).
      operationId: updateJob
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The MongoDB id of the job posting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobPosting'
      responses:
        '200':
          description: Job posting updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPosting'
        '404':
          description: Job posting not found
    delete:
      tags:
        - Jobs
      summary: Delete a saved job posting by id
      description: Removes a job posting from MongoDB.
      operationId: deleteJob
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The MongoDB id of the job posting.
      responses:
        '204':
          description: Job posting deleted successfully

  /api/resume/pdf:
    post:
      tags:
        - Resume
      summary: Generate PDF from Markdown
      description: Generates a PDF file from a given Markdown file located in the 'curriculums' directory.
      operationId: generatePdf
      parameters:
        - name: fileName
          in: query
          required: true
          schema:
            type: string
          description: The name of the markdown file (e.g., 'resume.md').
      responses:
        '200':
          description: PDF generated successfully
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: File not found
        '500':
          description: Error generating PDF

  /api/resume/download/{fileName}:
    get:
      tags:
        - Resume
      summary: Download generated PDF
      description: Downloads a previously generated PDF file from the 'output' directory.
      operationId: downloadPdf
      parameters:
        - name: fileName
          in: path
          required: true
          schema:
            type: string
          description: The name of the PDF file to download.
      responses:
        '200':
          description: PDF file downloaded successfully
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          description: PDF file not found
        '500':
          description: Internal server error

  /api/ai/generate:
    post:
      tags:
        - AI
      summary: Generate content using Ollama LLM
      description: Proxies or orchestrates a call to the Ollama service to generate text based on a prompt.
      operationId: generateAIContent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIGenerationRequest'
      responses:
        '200':
          description: Content generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIGenerationResponse'

components:
  schemas:
    JobPosting:
      type: object
      properties:
        id:
          type: string
          description: The MongoDB id of the job posting.
        title:
          type: string
        company:
          type: string
        location:
          type: string
        work_style:
          type: string
        employment_type:
          type: string
        seniority:
          type: string
        salary:
          type: string
        description:
          type: string
        requirements:
          type: array
          items:
            type: string
        benefits:
          type: array
          items:
            type: string
        posted_at:
          type: string
        applications_count:
          type: string
        sourceUrl:
          type: string
        status:
          type: string
          description: Processing status of the job posting.
          enum:
            - PENDING
            - COMPLETED
            - FAILED
        error:
          type: string
          nullable: true
          description: Error message when status is FAILED.
        createdAt:
          type: string
          format: date-time
        tech_stack:
          type: array
          items:
            type: string
        soft_skills:
          type: array
          items:
            type: string
        pros:
          type: array
          items:
            type: string
        cons:
          type: array
          items:
            type: string
        ai_summary:
          type: string
        interview_tips:
          type: array
          items:
            type: string
        ats_keywords:
          type: array
          items:
            type: string
        compatibility_score:
          type: string
        company_values:
          type: array
          items:
            type: string

    JobProcessRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: The URL of the job vacancy to be processed.
          example: "https://www.linkedin.com/jobs/view/..."
      required:
        - url

    AIGenerationRequest:
      type: object
      properties:
        prompt:
          type: string
          description: The prompt to send to the LLM.
          example: "Summarize the following job description..."
        model:
          type: string
          description: The model to use (e.g., deepseek-r1:1.5b).
          default: "deepseek-r1:1.5b"
      required:
        - prompt

    AIGenerationResponse:
      type: object
      properties:
        response:
          type: string
          description: The text generated by the AI.
        done:
          type: boolean
          description: Whether the generation is complete.
